name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, fileinfo, zip
          coverage: none

      # Everything else lives in one script so CI and local runs cannot drift:
      # php -l, verify.php for both sites, and tools/tests/*.php.
      - name: Merge gate (tools/ci-local.sh)
        run: bash tools/ci-local.sh
