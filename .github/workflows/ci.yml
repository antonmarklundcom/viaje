name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, fileinfo, zip
          coverage: none

      - name: Lint every PHP file
        run: |
          set -e
          find . -path ./dist -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Verify viaje.com.py
        run: php tools/verify.php viaje.com.py

      - name: Verify thingstodoinparaguay.com
        run: php tools/verify.php thingstodoinparaguay.com
